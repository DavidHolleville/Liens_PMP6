<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradé bleu/turquoise abyssal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020813" />
      <stop offset="50%" stop-color="#071935" />
      <stop offset="100%" stop-color="#005b84" />
    </linearGradient>
    <!-- Dégradé d'accentuation métallique -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond circulaire avec bordure luisante -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="12" filter="url(#glow)" />

  <!-- Logo de plongée : Masque et vagues -->
  <g transform="translate(128, 110)" stroke="url(#accentGrad)" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vagues sur le dessus -->
    <path d="M 30,30 Q 80,10 130,30 T 230,30" stroke-width="10" opacity="0.8"/>
    
    <!-- Silhouette d'un plongeur ou d'une bouteille/masque -->
    <!-- Bouteille de plongée stylisée -->
    <rect x="90" y="70" width="76" height="150" rx="38" stroke-width="14" />
    <path d="M 128,70 L 128,50 M 115,50 L 141,50 M 110,70 L 110,85" />
    
    <!-- Lunettes de plongée / Masque devant -->
    <path d="M 60,160 C 60,130 110,130 128,145 C 146,130 196,130 196,160 C 196,185 170,200 128,200 C 86,200 60,185 60,160 Z" fill="#071935" stroke-width="12" />
    <path d="M 95,160 L 161,160" stroke-width="6" opacity="0.6"/>
  </g>
  
  <!-- Texte PMP6 -->
  <text x="256" y="410" font-family="'Outfit', sans-serif" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    PMP6
  </text>
</svg>
