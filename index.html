<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMP6 - Liens Utiles</title>
    
    <!-- Meta tags pour le SEO et le comportement Web -->
    <meta name="description" content="Portail des liens web utiles pour l'association de plongée sous-marine PMP6. Accessible sur PC et mobile, utilisable hors ligne.">
    <meta name="theme-color" content="#0a192f">
    
    <!-- Liens pour la PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    
    <!-- Polices Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Feuilles de style -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Arrière-plan animé avec bulles -->
    <div class="bubble-container" id="bubbleContainer"></div>

    <header class="app-header">
        <div class="header-content">
            <div class="logo-area">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M12 8v8"/>
                    <path d="M8 12h8"/>
                </svg>
                <div class="logo-text">
                    <h1>PMP6</h1>
                    <p>Plongée Sous-Marine</p>
                </div>
            </div>
            
            <div class="header-actions" style="display: flex; gap: 0.75rem; align-items: center;">
                <button id="requestLinkBtn" class="request-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    Demander un lien
                </button>
                <button id="pwaInstallBtn" class="install-btn hidden">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Installer l'appli
                </button>
            </div>
        </div>
    </header>

    <main class="app-main">
        <!-- Barre de recherche -->
        <section class="search-section">
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Rechercher un lien, un niveau, une catégorie..." autocomplete="off">
                <button id="clearSearchBtn" class="clear-btn hidden" aria-label="Effacer la recherche">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
        </section>

        <!-- Fil d'Ariane & Navigation de retour -->
        <section class="nav-bar">
            <div class="breadcrumb-container">
                <button id="backBtn" class="back-btn hidden">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                    Retour
                </button>
                <div class="breadcrumbs" id="breadcrumbs">
                    <span class="breadcrumb-item active" data-path="root">Accueil</span>
                </div>
            </div>
            <div class="items-count" id="itemsCount"></div>
        </section>

        <!-- Conteneur d'affichage des grilles (catégories, sous-catégories ou liens) -->
        <section class="grid-section">
            <div class="grid-container" id="gridContainer">
                <!-- Les cartes seront injectées dynamiquement en JS -->
            </div>
            
            <!-- Message de recherche vide -->
            <div id="noResults" class="no-results hidden">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="64" height="64">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.3-4.3"/>
                    <path d="M8 11h6"/>
                </svg>
                <h3>Aucun lien trouvé</h3>
                <p>Essayez de chercher autre chose ou naviguez dans les catégories ci-dessus.</p>
            </div>
        </section>
    </main>

    <!-- Modal pour demander l'ajout d'un lien -->
    <div id="requestModal" class="modal hidden">
        <div class="modal-backdrop" id="modalBackdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>Demander l'ajout d'un lien</h3>
                <button id="closeRequestModalBtn" class="close-modal-btn" aria-label="Fermer">&times;</button>
            </div>
            
            <div class="modal-body">
                <form id="requestLinkForm">
                    <div class="form-group">
                        <label for="reqRequester">Nom du demandeur *</label>
                        <input type="text" id="reqRequester" required placeholder="Ex: Jean Dupont">
                    </div>
                    <div class="form-group">
                        <label for="reqCategory">Rubrique *</label>
                        <input type="text" id="reqCategory" required placeholder="Ex: Formation, FFESSM...">
                    </div>
                    <div class="form-group">
                        <label for="reqSubcategory">Sous-rubrique (optionnel)</label>
                        <input type="text" id="reqSubcategory" placeholder="Ex: N1, Glénan...">
                    </div>
                    <div class="form-group">
                        <label for="reqName">Texte à afficher (Nom du lien) *</label>
                        <input type="text" id="reqName" required placeholder="Ex: Inscription piscine">
                    </div>
                    <div class="form-group">
                        <label for="reqUrl">Lien (URL) *</label>
                        <input type="url" id="reqUrl" required placeholder="Ex: https://...">
                    </div>
                    <div class="form-group">
                        <label for="reqImage">Image à afficher (optionnel)</label>
                        <input type="text" id="reqImage" placeholder="Ex: piscine.png ou URL d'image">
                    </div>
                    <button type="submit" class="modal-action-btn" style="width: 100%; margin-top: 0.5rem;">
                        Envoyer la demande par mail
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal pour déverrouiller un lien -->
    <div id="lockModal" class="modal hidden">
        <div class="modal-backdrop" id="lockModalBackdrop"></div>
        <div class="modal-content pin-modal-content">
            <div class="modal-header">
                <h3>Accès Sécurisé</h3>
                <button id="closeLockModalBtn" class="close-modal-btn" aria-label="Fermer">&times;</button>
            </div>
            
            <div class="modal-body pin-modal-body">
                <div class="pin-icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lock-icon-svg">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
                <p class="pin-message">Saisissez le code à 4 chiffres pour ouvrir ce lien</p>
                
                <!-- Indicateurs de saisie -->
                <div class="pin-display" id="pinDisplay">
                    <div class="pin-dot"></div>
                    <div class="pin-dot"></div>
                    <div class="pin-dot"></div>
                    <div class="pin-dot"></div>
                </div>
                
                <!-- Clavier numérique -->
                <div class="pin-keyboard">
                    <button class="pin-key" data-value="1">1</button>
                    <button class="pin-key" data-value="2">2</button>
                    <button class="pin-key" data-value="3">3</button>
                    <button class="pin-key" data-value="4">4</button>
                    <button class="pin-key" data-value="5">5</button>
                    <button class="pin-key" data-value="6">6</button>
                    <button class="pin-key" data-value="7">7</button>
                    <button class="pin-key" data-value="8">8</button>
                    <button class="pin-key" data-value="9">9</button>
                    <button class="pin-key pin-key-clear" id="pinClear">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
                            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
                            <line x1="18" y1="9" x2="12" y2="15"/>
                            <line x1="12" y1="9" x2="18" y2="15"/>
                        </svg>
                    </button>
                    <button class="pin-key" data-value="0">0</button>
                    <button class="pin-key pin-key-cancel" id="pinCancel">Annuler</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Fichiers scripts -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
